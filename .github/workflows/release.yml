name: Build and publish release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify release tag matches package version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Release tag $env:GITHUB_REF_NAME does not match pyproject.toml version $version."
          }

      - name: Install Gitleaks
        shell: pwsh
        run: choco install gitleaks --version=8.30.1 --no-progress -y

      - name: Run release security check
        shell: pwsh
        run: ./scripts/release-check.ps1

      - name: Run unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = 'src'
          python -m unittest discover -s tests -v

      - name: Build portable executable
        shell: pwsh
        run: ./build-portable.ps1 -OutputFileName 'InputWeave-${{ github.ref_name }}.exe'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $exe = Join-Path (Split-Path -Parent $PWD) "InputWeave-$env:TAG.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Release executable was not created: $exe"
          }
          gh release create $env:TAG $exe --title "InputWeave $env:TAG" --generate-notes
